name: Deploy Radio by XivIoT to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Restore cached static stations snapshot (every 6h bucket)
        id: stations-cache
        uses: actions/cache@v4
        with:
          path: public/data/stations-es.json
          key: stations-es-v1-${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}-${{ github.run_id }}
          restore-keys: |
            stations-es-v1-false-
            stations-es-v1-true-
            stations-es-v1-

      - name: Refresh static stations snapshot on schedule or when missing
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || !hashFiles('public/data/stations-es.json')
        run: node scripts/fetch-stations.mjs || true

      - name: Build application for GitHub Pages
        env:
          VITE_BASE_PATH: /radio/
          VITE_CARTODB_API_KEY: ${{ secrets.VITE_CARTODB_API_KEY }}
          VITE_RADIO_PROXY_URL: ${{ secrets.VITE_RADIO_PROXY_URL }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
